name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy,rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfontconfig1-dev \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libxkbcommon-x11-0 \
            plocate \
            pkg-config \
            xauth \
            xvfb

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: linux
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check optional feature combinations
        run: |
          cargo check --locked --no-default-features --all-targets
          cargo check --locked --no-default-features --features gui --all-targets
          cargo check --locked --no-default-features --features index --all-targets

      - name: Build release binary
        run: cargo build --locked --release

      - name: Test GUI startup
        timeout-minutes: 2
        run: |
          xvfb-run --auto-servernum env \
            CEFDETECTOR_GUI_SMOKE_TEST=1 \
            LIBGL_ALWAYS_SOFTWARE=1 \
            target/release/cefdetector
          xvfb-run --auto-servernum env \
            CEFDETECTOR_GUI_SMOKE_TEST=1 \
            LIBGL_ALWAYS_SOFTWARE=1 \
            target/release/cefdetector --system-font

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: windows
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check optional feature combinations
        run: |
          cargo check --locked --no-default-features --all-targets
          cargo check --locked --no-default-features --features gui --all-targets
          cargo check --locked --no-default-features --features index --all-targets

      - name: Build release binary
        run: cargo build --locked --release

      - name: Install Mesa software renderer
        uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72 # v3.0.0
        with:
          version: "26.0.3"
          build-type: release-msvc
          deployment-choice: "1"

      - name: Test GUI startup
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CEFDETECTOR_GUI_SMOKE_TEST = "1"
          & target/release/cefdetector.exe
          if ($LASTEXITCODE -ne 0) {
            throw "GUI startup test exited with code $LASTEXITCODE"
          }
          & target/release/cefdetector.exe --system-font
          if ($LASTEXITCODE -ne 0) {
            throw "System-font GUI startup test exited with code $LASTEXITCODE"
          }

      - name: Stage executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -LiteralPath target/release/cefdetector.exe `
            -Destination "dist/cefdetector-windows-x86_64.exe"
          Copy-Item -LiteralPath @("fonts/OFL-Inter.txt", "fonts/NOTICE.txt") `
            -Destination dist

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cefdetector-windows-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS 15 arm64
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy

      - name: Verify Apple Silicon host
        run: |
          test "$(uname -m)" = "arm64"
          rustc_details="$(rustc -vV)"
          printf '%s\n' "${rustc_details}"
          rust_host="$(awk '$1 == "host:" { print $2 }' <<<"${rustc_details}")"
          test "${rust_host}" = "aarch64-apple-darwin"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: macos-15
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check optional feature combinations
        run: |
          cargo check --locked --no-default-features --all-targets
          cargo check --locked --no-default-features --features gui --all-targets
          cargo check --locked --no-default-features --features index --all-targets

      - name: Build release binary
        run: cargo build --locked --release

      - name: Test CLI and Spotlight command
        run: |
          target/release/cefdetector --version
          target/release/cefdetector --help
          /usr/bin/mdfind -0 'kMDItemContentTypeTree == "com.apple.application-bundle"' >/dev/null
          target/release/cefdetector cli --json >/tmp/cefdetector.json
          jq empty /tmp/cefdetector.json

      - name: Test GUI startup
        timeout-minutes: 2
        env:
          CEFDETECTOR_GUI_SMOKE_TEST: "1"
        run: |
          target/release/cefdetector
          target/release/cefdetector --system-font

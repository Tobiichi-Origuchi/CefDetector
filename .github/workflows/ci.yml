name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: ignore
            cargo_args: ""
          - backend: plocate
            cargo_args: --no-default-features --features plocate

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy,rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfontconfig1-dev \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libxkbcommon-x11-0 \
            plocate \
            pkg-config \
            xauth \
            xvfb

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.backend }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Check formatting
        if: matrix.backend == 'ignore'
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked ${{ matrix.cargo_args }} --all-targets

      - name: Run Clippy
        run: cargo clippy --locked ${{ matrix.cargo_args }} --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release ${{ matrix.cargo_args }}

      - name: Test GUI startup
        timeout-minutes: 2
        run: |
          xvfb-run --auto-servernum env \
            CEFDETECTOR_GUI_SMOKE_TEST=1 \
            LIBGL_ALWAYS_SOFTWARE=1 \
            target/release/cefdetector

  windows:
    name: Windows (${{ matrix.backend }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: ignore
            cargo_args: ""
          - backend: everything
            cargo_args: --no-default-features --features everything

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.backend }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Run tests
        run: cargo test --locked ${{ matrix.cargo_args }} --all-targets

      - name: Run Clippy
        run: cargo clippy --locked ${{ matrix.cargo_args }} --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release ${{ matrix.cargo_args }}

      - name: Install Mesa software renderer
        uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72 # v3.0.0
        with:
          version: "26.0.3"
          build-type: release-msvc
          deployment-choice: "1"

      - name: Test GUI startup
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CEFDETECTOR_GUI_SMOKE_TEST = "1"
          & target/release/cefdetector.exe
          if ($LASTEXITCODE -ne 0) {
            throw "GUI startup test exited with code $LASTEXITCODE"
          }

      - name: Stage executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -LiteralPath target/release/cefdetector.exe `
            -Destination "dist/cefdetector-windows-x86_64-${{ matrix.backend }}.exe"

      - name: Upload executable
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cefdetector-windows-x86_64-${{ matrix.backend }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS 15 arm64 (${{ matrix.backend }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: ignore
            cargo_args: ""
          - backend: spotlight
            cargo_args: --no-default-features --features spotlight

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy

      - name: Verify Apple Silicon host
        run: |
          test "$(uname -m)" = "arm64"
          rustc_details="$(rustc -vV)"
          printf '%s\n' "${rustc_details}"
          rust_host="$(awk '$1 == "host:" { print $2 }' <<<"${rustc_details}")"
          test "${rust_host}" = "aarch64-apple-darwin"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: macos-15-${{ matrix.backend }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Run tests
        run: cargo test --locked ${{ matrix.cargo_args }} --all-targets

      - name: Run Clippy
        run: cargo clippy --locked ${{ matrix.cargo_args }} --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release ${{ matrix.cargo_args }}

      - name: Test CLI and Spotlight command
        run: |
          target/release/cefdetector --version
          target/release/cefdetector --help
          if [[ "${{ matrix.backend }}" == "spotlight" ]]; then
            /usr/bin/mdfind -0 'kMDItemContentTypeTree == "com.apple.application-bundle"' >/dev/null
            target/release/cefdetector --json >/tmp/cefdetector-spotlight.json
            jq empty /tmp/cefdetector-spotlight.json
          fi

      - name: Test GUI startup
        timeout-minutes: 2
        env:
          CEFDETECTOR_GUI_SMOKE_TEST: "1"
        run: target/release/cefdetector

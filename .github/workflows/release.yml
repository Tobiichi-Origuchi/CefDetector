name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Resolve release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve release tag
        id: release
        env:
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${MANUAL_TAG}"
          else
            release_tag="${PUSH_TAG}"
          fi
          if [[ ! "${release_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release tag: ${release_tag}" >&2
            exit 1
          fi
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          if [[ "${release_tag}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Verify tag matches Cargo version
        id: version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          package_version="$(
            awk '
              $0 == "[package]" { in_package = 1; next }
              /^\[/ { in_package = 0 }
              in_package && $1 == "version" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )"
          tag_version="${RELEASE_TAG#v}"
          if [[ -z "${package_version}" || "${package_version}" != "${tag_version}" ]]; then
            echo "Cargo version ${package_version:-<missing>} does not match tag ${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

  linux:
    name: Linux packages
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy,rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfontconfig1-dev \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libxkbcommon-x11-0 \
            plocate \
            pkg-config \
            xauth \
            xvfb

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate merged backends
        run: |
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo check --locked --no-default-features --all-targets
          cargo check --locked --no-default-features --features gui --all-targets
          cargo check --locked --no-default-features --features index --all-targets

      - name: Build Linux archives
        env:
          PACKAGE_OUTPUT_DIR: dist
        run: ./.github/scripts/package-linux.sh "${{ needs.metadata.outputs.version }}"

      - name: Test packaged GUI binaries
        timeout-minutes: 2
        run: |
          xvfb-run --auto-servernum env \
            CEFDETECTOR_GUI_SMOKE_TEST=1 \
            LIBGL_ALWAYS_SOFTWARE=1 \
            target/release/package-binaries/cefdetector

      - name: Inspect Linux archives
        run: |
          set -euo pipefail
          tar -tzf dist/cefdetector-*-linux-x86_64.tar.gz >/dev/null
          ls -lh dist

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x86_64
          path: dist/cefdetector-*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows package
    needs: metadata
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-windows

      - name: Validate release source
        run: |
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo check --locked --no-default-features --all-targets
          cargo check --locked --no-default-features --features gui --all-targets
          cargo check --locked --no-default-features --features index --all-targets

      - name: Build release binary
        run: cargo build --locked --release

      - name: Install Mesa software renderer
        uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72 # v3.0.0
        with:
          version: "26.0.3"
          build-type: release-msvc
          deployment-choice: "1"

      - name: Test GUI startup
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CEFDETECTOR_GUI_SMOKE_TEST = "1"
          & target/release/cefdetector.exe
          if ($LASTEXITCODE -ne 0) {
            throw "GUI startup test exited with code $LASTEXITCODE"
          }

      - name: Build ZIP package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $packageName = "cefdetector-$env:RELEASE_VERSION-windows-x86_64"
          $stagingDirectory = Join-Path $env:RUNNER_TEMP $packageName
          New-Item -ItemType Directory -Force $stagingDirectory | Out-Null
          $packageFiles = @(
            "target/release/cefdetector.exe"
            "README.md"
            "LICENSE"
            "fonts/OFL-Inter.txt"
            "fonts/NOTICE.txt"
          )
          Copy-Item -LiteralPath $packageFiles -Destination $stagingDirectory
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $stagingDirectory `
            -DestinationPath "dist/$packageName.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS Apple Silicon packages
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy

      - name: Verify Apple Silicon host
        run: |
          test "$(uname -m)" = "arm64"
          rustc_details="$(rustc -vV)"
          printf '%s\n' "${rustc_details}"
          rust_host="$(awk '$1 == "host:" { print $2 }' <<<"${rustc_details}")"
          test "${rust_host}" = "aarch64-apple-darwin"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-macos

      - name: Validate both macOS backends
        run: |
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo check --locked --no-default-features --all-targets
          cargo check --locked --no-default-features --features gui --all-targets
          cargo check --locked --no-default-features --features index --all-targets

      - name: Build ad-hoc signed app bundles
        env:
          PACKAGE_OUTPUT_DIR: dist
        run: ./.github/scripts/package-macos.sh "${{ needs.metadata.outputs.version }}"

      - name: Test packaged applications
        timeout-minutes: 4
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          archive="dist/cefdetector-${RELEASE_VERSION}-macos-aarch64.zip"
          test -f "${archive}"
          unpacked="${RUNNER_TEMP}/smoke-$(basename "${archive}" .zip)"
          ditto -x -k "${archive}" "${unpacked}"
          CEFDETECTOR_GUI_SMOKE_TEST=1 "${unpacked}/CefDetector.app/Contents/MacOS/cefdetector"
          codesign --verify --deep --strict --verbose=2 "${unpacked}/CefDetector.app"
          codesign_description="$(codesign --display --verbose=4 "${unpacked}/CefDetector.app" 2>&1)"
          printf '%s\n' "${codesign_description}"
          grep -Fxq 'Signature=adhoc' <<<"${codesign_description}"
          file_description="$(file "${unpacked}/CefDetector.app/Contents/MacOS/cefdetector")"
          printf '%s\n' "${file_description}"
          grep -Fq 'arm64' <<<"${file_description}"
          lipo_description="$(lipo -info "${unpacked}/CefDetector.app/Contents/MacOS/cefdetector")"
          printf '%s\n' "${lipo_description}"
          if grep -Fq 'x86_64' <<<"${lipo_description}"; then
            echo "Packaged binary contains a forbidden x86_64 slice" >&2
            exit 1
          fi

      - name: Upload macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-aarch64
          path: dist/cefdetector-*-macos-aarch64.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs:
      - metadata
      - linux
      - windows
      - macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -- * > SHA256SUMS
          )
          ls -lh dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

      - name: Publish stable release to AUR
        if: needs.metadata.outputs.prerelease == 'false'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          RELEASE_ASSET_DIR: ${{ github.workspace }}/dist
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          if [[ -z "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not configured; skipping AUR publication"
            exit 0
          fi
          ./.github/scripts/publish-aur.sh "${RELEASE_TAG}"

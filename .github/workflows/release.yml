name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Resolve release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve release tag
        id: release
        env:
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${MANUAL_TAG}"
          else
            release_tag="${PUSH_TAG}"
          fi
          if [[ ! "${release_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release tag: ${release_tag}" >&2
            exit 1
          fi
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          if [[ "${release_tag}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Verify tag matches Cargo version
        id: version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          package_version="$(
            awk '
              $0 == "[package]" { in_package = 1; next }
              /^\[/ { in_package = 0 }
              in_package && $1 == "version" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )"
          tag_version="${RELEASE_TAG#v}"
          if [[ -z "${package_version}" || "${package_version}" != "${tag_version}" ]]; then
            echo "Cargo version ${package_version:-<missing>} does not match tag ${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

  linux:
    name: Linux packages
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy,rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfontconfig1-dev \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libxkbcommon-x11-0 \
            plocate \
            pkg-config \
            xauth \
            xvfb

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate ignore backend
        run: |
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

      - name: Validate plocate backend
        run: |
          cargo test --locked --no-default-features --features plocate --all-targets
          cargo clippy --locked --no-default-features --features plocate --all-targets -- -D warnings

      - name: Build Linux archives
        env:
          PACKAGE_OUTPUT_DIR: dist
        run: ./.github/scripts/package-linux.sh "${{ needs.metadata.outputs.version }}"

      - name: Test packaged GUI binaries
        timeout-minutes: 2
        run: |
          set -euo pipefail
          for backend in ignore plocate; do
            xvfb-run --auto-servernum env \
              CEFDETECTOR_GUI_SMOKE_TEST=1 \
              LIBGL_ALWAYS_SOFTWARE=1 \
              "target/release/package-binaries/cefdetector-${backend}"
          done

      - name: Inspect Linux archives
        run: |
          set -euo pipefail
          for archive in dist/cefdetector-*-linux-x86_64-*.tar.gz; do
            tar -tzf "${archive}" >/dev/null
          done
          ls -lh dist

      - name: Upload Linux packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-linux-x86_64
          path: dist/cefdetector-*-linux-x86_64-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows package (${{ matrix.backend }})
    needs: metadata
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: ignore
            cargo_args: ""
          - backend: everything
            cargo_args: --no-default-features --features everything

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.backend }}

      - name: Validate release source
        run: |
          cargo test --locked ${{ matrix.cargo_args }} --all-targets
          cargo clippy --locked ${{ matrix.cargo_args }} --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release ${{ matrix.cargo_args }}

      - name: Install Mesa software renderer
        uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72 # v3.0.0
        with:
          version: "26.0.3"
          build-type: release-msvc
          deployment-choice: "1"

      - name: Test GUI startup
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CEFDETECTOR_GUI_SMOKE_TEST = "1"
          & target/release/cefdetector.exe
          if ($LASTEXITCODE -ne 0) {
            throw "GUI startup test exited with code $LASTEXITCODE"
          }

      - name: Build ZIP package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $packageName = "cefdetector-$env:RELEASE_VERSION-windows-x86_64-${{ matrix.backend }}"
          $stagingDirectory = Join-Path $env:RUNNER_TEMP $packageName
          New-Item -ItemType Directory -Force $stagingDirectory | Out-Null
          Copy-Item -LiteralPath target/release/cefdetector.exe, README.md, LICENSE `
            -Destination $stagingDirectory
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $stagingDirectory `
            -DestinationPath "dist/$packageName.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-windows-x86_64-${{ matrix.backend }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS Apple Silicon packages
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy

      - name: Verify Apple Silicon host
        run: |
          test "$(uname -m)" = "arm64"
          rustc -vV
          rustc -vV | grep -q '^host: aarch64-apple-darwin$'

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-macos

      - name: Validate both macOS backends
        run: |
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --no-default-features --features spotlight --all-targets
          cargo clippy --locked --no-default-features --features spotlight --all-targets -- -D warnings

      - name: Import Developer ID certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CERTIFICATE_P12}" ]]; then
            echo 'identity=-' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          keychain="${RUNNER_TEMP}/cefdetector-signing.keychain-db"
          security create-keychain -p '' "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p '' "${keychain}"
          printf '%s' "${CERTIFICATE_P12}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" -k "${keychain}" \
            -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "${keychain}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k '' "${keychain}"
          identity="$(security find-identity -v -p codesigning "${keychain}" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "${identity}"
          echo "identity=${identity}" >> "${GITHUB_OUTPUT}"

      - name: Require release signing and notarization credentials
        if: needs.metadata.outputs.prerelease == 'false'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          test "${SIGNING_IDENTITY}" != '-'
          test -n "${APPLE_ID}"
          test -n "${APPLE_TEAM_ID}"
          test -n "${APPLE_APP_PASSWORD}"

      - name: Build signed app bundles
        env:
          MACOS_CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          PACKAGE_OUTPUT_DIR: dist
        run: ./.github/scripts/package-macos.sh "${{ needs.metadata.outputs.version }}"

      - name: Test packaged applications
        timeout-minutes: 4
        run: |
          set -euo pipefail
          for archive in dist/cefdetector-*-macos-aarch64-*.zip; do
            unpacked="${RUNNER_TEMP}/smoke-$(basename "${archive}" .zip)"
            ditto -x -k "${archive}" "${unpacked}"
            CEFDETECTOR_GUI_SMOKE_TEST=1 "${unpacked}/CefDetector.app/Contents/MacOS/cefdetector"
            codesign --verify --deep --strict --verbose=2 "${unpacked}/CefDetector.app"
            file "${unpacked}/CefDetector.app/Contents/MacOS/cefdetector" | grep -q arm64
            ! lipo -info "${unpacked}/CefDetector.app/Contents/MacOS/cefdetector" | grep -q x86_64
          done

      - name: Notarize and staple stable packages
        if: needs.metadata.outputs.prerelease == 'false'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for archive in dist/cefdetector-*-macos-aarch64-*.zip; do
            xcrun notarytool submit "${archive}" --wait \
              --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" --password "${APPLE_APP_PASSWORD}"
            unpacked="${RUNNER_TEMP}/notarized-$(basename "${archive}" .zip)"
            ditto -x -k "${archive}" "${unpacked}"
            xcrun stapler staple "${unpacked}/CefDetector.app"
            codesign --verify --deep --strict --verbose=2 "${unpacked}/CefDetector.app"
            spctl --assess --type execute --verbose=2 "${unpacked}/CefDetector.app"
            rm "${archive}"
            ditto -c -k --sequesterRsrc --keepParent "${unpacked}/CefDetector.app" "${archive}"
          done

      - name: Upload macOS packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-macos-aarch64
          path: dist/cefdetector-*-macos-aarch64-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs:
      - metadata
      - linux
      - windows
      - macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -- * > SHA256SUMS
          )
          ls -lh dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

      - name: Publish stable release to AUR
        if: needs.metadata.outputs.prerelease == 'false'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          RELEASE_ASSET_DIR: ${{ github.workspace }}/dist
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          if [[ -z "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not configured; skipping AUR publication"
            exit 0
          fi
          ./.github/scripts/publish-aur.sh "${RELEASE_TAG}"

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  metadata:
    name: Resolve release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve release tag
        id: release
        env:
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${MANUAL_TAG}"
          else
            release_tag="${PUSH_TAG}"
          fi
          if [[ ! "${release_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release tag: ${release_tag}" >&2
            exit 1
          fi
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          if [[ "${release_tag}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Verify tag matches Cargo version
        id: version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          package_version="$(
            awk '
              $0 == "[package]" { in_package = 1; next }
              /^\[/ { in_package = 0 }
              in_package && $1 == "version" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )"
          tag_version="${RELEASE_TAG#v}"
          if [[ -z "${package_version}" || "${package_version}" != "${tag_version}" ]]; then
            echo "Cargo version ${package_version:-<missing>} does not match tag ${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

  linux:
    name: Linux packages
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy,rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libfontconfig1-dev pkg-config

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release

      - name: Validate release source
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --no-default-features --features plocate --all-targets
          cargo clippy --locked --no-default-features --features plocate --all-targets -- -D warnings

      - name: Install cargo-packager
        run: cargo install cargo-packager --version "=${CARGO_PACKAGER_VERSION}" --locked

      - name: Build packages
        run: cargo packager --release

      - name: Build plocate package
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: ./.github/scripts/package-plocate.sh "${RELEASE_VERSION}"

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/packager/*.deb dist/
          cp target/release/packager/*_x86_64.tar.gz dist/
          ls -lh dist

      - name: Upload Linux packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows package (${{ matrix.backend }})
    needs: metadata
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: ignore
            cargo_args: ""
          - backend: everything
            cargo_args: --no-default-features --features everything

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.backend }}

      - name: Validate release source
        run: |
          cargo test --locked ${{ matrix.cargo_args }} --all-targets
          cargo clippy --locked ${{ matrix.cargo_args }} --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release ${{ matrix.cargo_args }}

      - name: Build ZIP package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $packageName = "cefdetector-$env:RELEASE_VERSION-windows-x86_64-${{ matrix.backend }}"
          $stagingDirectory = Join-Path $env:RUNNER_TEMP $packageName
          New-Item -ItemType Directory -Force $stagingDirectory | Out-Null
          Copy-Item -LiteralPath target/release/cefdetector.exe, README.md, LICENSE `
            -Destination $stagingDirectory
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $stagingDirectory `
            -DestinationPath "dist/$packageName.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-windows-${{ matrix.backend }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs:
      - metadata
      - linux
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -- * > SHA256SUMS
          )
          ls -lh dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

      - name: Publish stable release to AUR
        if: needs.metadata.outputs.prerelease == 'false'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          RELEASE_ASSET_DIR: ${{ github.workspace }}/dist
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          if [[ -z "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not configured; skipping AUR publication"
            exit 0
          fi
          ./.github/scripts/publish-aur.sh "${RELEASE_TAG}"
